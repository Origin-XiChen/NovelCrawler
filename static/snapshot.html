<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>NovelCrawler · 离线</title>
<!--
  离线包内置阅读器。三条硬约束:
  1. 全相对路径,file:// 双击即可用,不联网、不引任何外部资源;
  2. 小说正文来自 data/<书名>.js(window.__SNAP_DATA__),漫画直接读 comics/<标题>/pages/NNNN.jpg;
  3. 主题/字号/进度只存 localStorage —— 离线包的定位是"带走看",不做同步。
-->
<style>
  :root{
    --bg:#f7f5f1; --card:#fff; --line:#e8e4dc; --text:#1f1f21; --text-2:#6b6b70; --text-3:#9a9aa0;
    --brand:#b4532a; --brand-weak:#f6ece6; --shadow:0 1px 2px rgba(20,18,16,.04),0 8px 24px rgba(20,18,16,.06);
    --fs:17px; --reader-w:38rem;
  }
  [data-theme="dark"]{
    --bg:#16151a; --card:#1e1d23; --line:#2c2b33; --text:#eceae6; --text-2:#a8a6b0; --text-3:#6f6d78;
    --brand:#e08b5f; --brand-weak:#2a211c; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);
       font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       -webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 20px 64px}
  .bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 20px;
       background:var(--bg);border-bottom:1px solid var(--line)}
  .bar h1{margin:0;font-size:16px;font-weight:650;letter-spacing:.2px}
  .bar .meta{font-size:12px;color:var(--text-3)} .bar .grow{flex:1}
  .icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--text-2);transition:.15s}
  .icon:hover{background:var(--brand-weak);color:var(--brand)}
  .group-head{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px}
  .group-head h2{margin:0;font-size:14px;font-weight:650;letter-spacing:.4px}
  .group-head span{font-size:12px;color:var(--text-3)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
  .card{display:flex;flex-direction:column;gap:6px;padding:16px;text-align:left;background:var(--card);
        border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
        transition:transform .16s,border-color .16s}
  .card:hover{transform:translateY(-2px);border-color:var(--brand)}
  .card .t{font-weight:620;font-size:14.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;
           -webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
  .card .s{font-size:12px;color:var(--text-3)}
  .tag{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;font-size:11px;
       font-weight:600;background:var(--brand-weak);color:var(--brand)}
  .empty{margin:48px 0;text-align:center;color:var(--text-3);font-size:13px;line-height:2}
  .reader{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;background:var(--bg)}
  .reader.show{display:flex}
  .rd-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg)}
  .rd-bar .title{flex:1;min-width:0;font-size:14px;font-weight:620;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rd-bar .pos{font-size:12px;color:var(--text-3);white-space:nowrap}
  .rd-body{flex:1;overflow-y:auto;overscroll-behavior:contain}
  .rd-inner{max-width:var(--reader-w);margin:0 auto;padding:32px 24px 24px}
  .rd-inner h2{margin:0 0 22px;font-size:19px;font-weight:650;line-height:1.5}
  .rd-text p{margin:0 0 1.05em;text-indent:2em;text-align:justify;line-height:1.95;
             font-size:var(--fs);word-break:break-word}
  .rd-text img{max-width:100%;height:auto;border-radius:8px;text-indent:0;display:block;margin:12px auto}
  .rd-nav{max-width:var(--reader-w);width:100%;margin:0 auto;padding:0 24px 28px;display:flex;gap:10px}
  /* hidden 属性会被 display:flex 压掉,漫画模式下必须显式隐藏翻章按钮 */
  .rd-nav[hidden]{display:none}
  .btn{flex:1;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--card);
       font-size:13.5px;font-weight:600;color:var(--text-2);transition:.15s}
  .btn:hover{border-color:var(--brand);color:var(--brand)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .comic-stage{display:grid;place-items:center;min-height:100%;padding:0;background:#0e0e10}
  .comic-stage img{max-width:100%;max-height:100%;display:block}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);padding:9px 16px;
         border-radius:999px;background:rgba(24,24,28,.92);color:#fff;font-size:13px;opacity:0;
         transition:.25s;pointer-events:none;z-index:60}
  .toast.show{opacity:1;transform:translateX(-50%)}
  .toc{position:fixed;top:0;bottom:0;left:0;width:min(320px,82vw);z-index:50;background:var(--card);
       border-right:1px solid var(--line);transform:translateX(-100%);transition:transform .22s;
       display:flex;flex-direction:column}
  .toc.show{transform:none}
  .toc h3{margin:0;padding:16px;font-size:13px;font-weight:650;color:var(--text-2);border-bottom:1px solid var(--line)}
  .toc ul{list-style:none;margin:0;padding:6px;overflow-y:auto}
  .toc li{padding:10px 12px;border-radius:9px;font-size:13.5px;color:var(--text-2);cursor:pointer;
          overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .toc li:hover,.toc li.on{background:var(--brand-weak);color:var(--brand)}
  .toc li.on{font-weight:650}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:45;display:none}
  .scrim.show{display:block}
  @media (max-width:560px){.wrap{padding:14px 14px 48px}.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}}
</style>
</head>
<body>

<header class="bar">
  <h1>NovelCrawler</h1>
  <div class="meta" id="genTime"></div>
  <div class="grow"></div>
  <button class="icon" id="themeBtn" title="切换主题">◐</button>
</header>

<div class="wrap">
  <div class="group-head"><h2>小说</h2><span id="novelCount"></span></div>
  <div class="grid" id="novelGrid"></div>
  <div class="group-head"><h2>漫画</h2><span id="comicCount"></span></div>
  <div class="grid" id="comicGrid"></div>
  <div class="empty" id="emptyTip" hidden>这个离线包里没有内容<br />请在电脑端勾选要打包的小说 / 漫画后重新生成</div>
</div>

<div class="reader" id="reader">
  <div class="rd-bar">
    <button class="icon" id="tocBtn" title="目录">☰</button>
    <div class="title" id="rdTitle"></div>
    <div class="pos" id="rdPos"></div>
    <button class="icon" id="fsDown" title="字号减小">A−</button>
    <button class="icon" id="fsUp" title="字号增大">A+</button>
    <button class="icon" id="rdClose" title="关闭">✕</button>
  </div>
  <div class="rd-body" id="rdBody"></div>
  <div class="rd-nav" id="rdNav">
    <button class="btn" id="prevBtn">← 上一章</button>
    <button class="btn" id="nextBtn">下一章 →</button>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="toc" id="toc">
  <h3 id="tocTitle">目录</h3>
  <ul id="tocList"></ul>
</aside>
<div class="toast" id="toast"></div>

<script>
const SNAP_RAW = null;
</script>
<script>
(function () {
  'use strict';
  var SNAP = (typeof SNAP_RAW !== 'undefined' && SNAP_RAW) ? SNAP_RAW : null;
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };

  var THEME_KEY = 'nc.offline.theme', FS_KEY = 'nc.offline.fs', POS_PREFIX = 'nc.offline.pos.';
  function applyTheme(t) {
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem(THEME_KEY, t); } catch (e) { /* 隐私模式 */ }
  }
  var savedTheme = '';
  try { savedTheme = localStorage.getItem(THEME_KEY) || ''; } catch (e) { /* ignore */ }
  applyTheme(savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  $('themeBtn').onclick = function () {
    applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  };

  var fontSize = 17;
  try { fontSize = Number(localStorage.getItem(FS_KEY)) || 17; } catch (e) { /* ignore */ }
  function applyFont() {
    fontSize = Math.min(26, Math.max(13, fontSize));
    document.documentElement.style.setProperty('--fs', fontSize + 'px');
    try { localStorage.setItem(FS_KEY, String(fontSize)); } catch (e) { /* ignore */ }
  }
  applyFont();
  $('fsUp').onclick = function () { fontSize += 1; applyFont(); };
  $('fsDown').onclick = function () { fontSize -= 1; applyFont(); };

  var toastTimer = null;
  function toast(msg) {
    var el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1800);
  }

  var books = (SNAP && SNAP.books) || [];
  var comics = (SNAP && SNAP.comics) || [];
  $('genTime').textContent = SNAP ? ('生成于 ' + (SNAP.gen_time || '')) : '';
  $('novelCount').textContent = books.length ? books.length + ' 本' : '';
  $('comicCount').textContent = comics.length ? comics.length + ' 部' : '';
  if (!books.length && !comics.length) $('emptyTip').hidden = false;

  books.forEach(function (b) {
    var el = document.createElement('button');
    el.className = 'card';
    el.innerHTML = '<div class="t">' + esc(b.name.replace(/\.[^.]+$/, '')) + '</div>'
      + '<div class="s">' + (b.chs ? b.chs + ' 章' : '无正文') + '</div>';
    el.onclick = function () { openNovel(b.name); };
    $('novelGrid').appendChild(el);
  });

  comics.forEach(function (c) {
    var el = document.createElement('button');
    el.className = 'card';
    var size = c.pages ? (c.pages + ' 页') : ((c.files || []).length + ' 个文件');
    el.innerHTML = '<div class="t">' + esc(c.title) + '</div><div class="s">' + esc(size) + '</div>'
      + (c.pages ? '' : '<span class="tag">仅 PDF</span>');
    el.onclick = function () {
      if (c.pages) openComic(c);
      else toast('这个包里没有页图，只有 PDF 原文件');
    };
    $('comicGrid').appendChild(el);
  });

  var cur = null;

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = src;
      s.onload = function () { resolve(); };
      s.onerror = function () { reject(new Error('数据文件缺失: ' + src)); };
      document.head.appendChild(s);
    });
  }

  async function openNovel(name) {
    var info = null;
    for (var i = 0; i < books.length; i += 1) if (books[i].name === name) { info = books[i]; break; }
    if (!info) return;
    $('reader').classList.add('show');
    $('rdTitle').textContent = name.replace(/\.[^.]+$/, '');
    $('rdPos').textContent = '';
    $('rdBody').innerHTML = '<div class="rd-inner"><div class="empty">正在解包…</div></div>';
    try {
      if (!window.__SNAP_DATA__ || !window.__SNAP_DATA__[name]) await loadScript(info.data);
      var data = (window.__SNAP_DATA__ || {})[name] || {};
      var chapters = data.chapters || [];
      if (!chapters.length) { toast('这本书没有可读章节'); closeReader(); return; }
      var start = 1;
      try {
        start = Number(localStorage.getItem(POS_PREFIX + name)) || 1;
      } catch (e) { start = 1; }
      start = Math.max(1, Math.min(chapters.length, start));
      cur = { type: 'novel', name: name, chapters: chapters, idx: start };
      $('rdNav').hidden = false;
      renderChapter();
    } catch (err) {
      toast(err && err.message ? err.message : '加载失败');
      closeReader();
    }
  }

  function renderChapter() {
    if (!cur || cur.type !== 'novel') return;
    var chapters = cur.chapters, idx = cur.idx;
    var ch = chapters[idx - 1] || {};
    $('rdTitle').textContent = ch.title || ('第 ' + idx + ' 章');
    $('rdPos').textContent = idx + ' / ' + chapters.length;
    var html;
    if (ch.html) {
      html = ch.html;
    } else {
      html = (ch.text || '').split(/\n+/).map(function (line) { return line.trim(); })
        .filter(Boolean).map(function (line) { return '<p>' + esc(line) + '</p>'; }).join('');
    }
    $('rdBody').innerHTML = '<div class="rd-inner"><h2>' + esc(ch.title || '') + '</h2>'
      + '<div class="rd-text">' + (html || '<p>（本章为空）</p>') + '</div></div>';
    $('rdBody').scrollTop = 0;
    $('prevBtn').disabled = idx <= 1;
    $('nextBtn').disabled = idx >= chapters.length;
    buildToc(chapters, idx);
    try { localStorage.setItem(POS_PREFIX + cur.name, String(idx)); } catch (e) { /* ignore */ }
  }

  $('prevBtn').onclick = function () {
    if (cur && cur.type === 'novel' && cur.idx > 1) { cur.idx -= 1; renderChapter(); }
  };
  $('nextBtn').onclick = function () {
    if (cur && cur.type === 'novel' && cur.idx < cur.chapters.length) { cur.idx += 1; renderChapter(); }
  };

  function openComic(comic) {
    cur = { type: 'comic', comic: comic, page: 1 };
    $('reader').classList.add('show');
    $('rdNav').hidden = true;
    $('rdTitle').textContent = comic.title;
    renderComicPage();
    buildComicToc(comic);
  }

  function comicSrc(comic, page) {
    var dir = String(comic.pages_dir || '').replace(/\/+$/, '');
    return dir + '/pages/' + ('0000' + page).slice(-4) + '.jpg';
  }

  function renderComicPage() {
    if (!cur || cur.type !== 'comic') return;
    var comic = cur.comic, page = cur.page;
    $('rdPos').textContent = page + ' / ' + comic.pages;
    $('rdBody').innerHTML = '<div class="comic-stage"><img id="comicImg" src="'
      + comicSrc(comic, page) + '" alt="第 ' + page + ' 页" /></div>';
    $('comicImg').onerror = function () { toast('第 ' + page + ' 页缺失'); };
    if (page < comic.pages) { var pre = new Image(); pre.src = comicSrc(comic, page + 1); }
  }

  function stepComic(delta) {
    if (!cur || cur.type !== 'comic') return;
    var next = cur.page + delta;
    if (next < 1 || next > cur.comic.pages) return;
    cur.page = next;
    renderComicPage();
  }

  $('rdBody').addEventListener('click', function (ev) {
    if (!cur || cur.type !== 'comic') return;
    var half = $('rdBody').clientWidth / 2;
    if (ev.clientX < half) stepComic(-1); else stepComic(1);
  });

  document.addEventListener('keydown', function (e) {
    if (!$('reader').classList.contains('show')) return;
    if (e.key === 'Escape') { closeReader(); return; }
    if (cur && cur.type === 'comic') {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); stepComic(1); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); stepComic(-1); }
    }
  });

  function buildToc(chapters, active) {
    $('tocTitle').textContent = '目录 · ' + chapters.length + ' 章';
    var list = $('tocList');
    list.innerHTML = '';
    chapters.forEach(function (ch, i) {
      var li = document.createElement('li');
      li.textContent = ch.title || ('第 ' + (i + 1) + ' 章');
      if (i + 1 === active) li.className = 'on';
      li.onclick = function () {
        if (cur && cur.type === 'novel') { cur.idx = i + 1; renderChapter(); }
        closeToc();
      };
      list.appendChild(li);
    });
  }

  function buildComicToc(comic) {
    var chs = comic.chapters || [];
    $('tocTitle').textContent = chs.length ? ('分话 · ' + chs.length + ' 话') : '跳转';
    var list = $('tocList');
    list.innerHTML = '';
    if (!chs.length) {
      var li0 = document.createElement('li');
      li0.textContent = '共 ' + comic.pages + ' 页（无分话信息）';
      list.appendChild(li0);
      return;
    }
    chs.forEach(function (ch) {
      var li = document.createElement('li');
      li.textContent = ch.label + '（第 ' + ch.from + ' 页）';
      li.onclick = function () {
        if (cur && cur.type === 'comic') { cur.page = ch.from; renderComicPage(); }
        closeToc();
      };
      list.appendChild(li);
    });
  }

  function openToc() { $('toc').classList.add('show'); $('scrim').classList.add('show'); }
  function closeToc() { $('toc').classList.remove('show'); $('scrim').classList.remove('show'); }
  $('tocBtn').onclick = function () {
    if ($('toc').classList.contains('show')) closeToc(); else openToc();
  };
  $('scrim').onclick = closeToc;

  function closeReader() {
    $('reader').classList.remove('show');
    $('rdBody').innerHTML = '';
    closeToc();
    cur = null;
  }
  $('rdClose').onclick = closeReader;
})();
</script>
</body>
</html>
