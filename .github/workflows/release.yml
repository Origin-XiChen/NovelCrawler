name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          DESKTOP=$(node -p "require('./desktop/package.json').version")
          WEB=$(node -p "require('./web/package.json').version")
          MOBILE=$(node -p "require('./web-mobile/package.json').version")
          BACKEND=$(python -c "from novel import __version__; print(__version__)")
          TAG=${GITHUB_REF_NAME#v}
          echo "package=$PKG desktop=$DESKTOP web=$WEB mobile=$MOBILE backend=$BACKEND tag=$TAG"
          if [ "$PKG" != "$TAG" ] || [ "$DESKTOP" != "$TAG" ] || [ "$WEB" != "$TAG" ] || [ "$MOBILE" != "$TAG" ] || [ "$BACKEND" != "$TAG" ]; then
            echo "::error::版本号不一致：请同步 package.json / desktop / web / web-mobile / novel.__version__ 与 tag"
            exit 1
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Install Node dependencies
        run: npm ci

      - name: Build and publish
        run: npm run dist:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

  android:
    needs: windows
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Check Android signing secrets
        id: signing
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，跳过 APK 构建与上传"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.signing.outputs.enabled == 'true'

      - uses: actions/setup-node@v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        if: steps.signing.outputs.enabled == 'true'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.signing.outputs.enabled == 'true'

      - name: Install Android SDK packages
        if: steps.signing.outputs.enabled == 'true'
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install Node dependencies
        if: steps.signing.outputs.enabled == 'true'
        run: npm ci

      - name: Prepare signing key
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Android 签名 Secrets 不完整"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > web-mobile/android/release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > web-mobile/android/keystore.properties

      - name: Build release APK
        if: steps.signing.outputs.enabled == 'true'
        run: |
          npm run apk:release -w web-mobile
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release-local
          cp web-mobile/android/app/build/outputs/apk/release/app-release.apk \
            "release-local/NovelCrawler-Mobile-${VERSION}.apk"

      - name: Upload APK to GitHub Release
        if: steps.signing.outputs.enabled == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" \
            "release-local/NovelCrawler-Mobile-${VERSION}.apk" --clobber
