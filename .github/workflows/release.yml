name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Release 的创建者由令牌决定：默认 GITHUB_TOKEN 会把作者显示为
      # github-actions[bot]；配置 RELEASE_TOKEN（Origin-XiChen 的 PAT）后作者就是本人。
      # 这里**只警告不阻断**：缺令牌时仍用 GITHUB_TOKEN 正常发布，正文保留「发布：Origin-XiChen」署名。
      # （曾把正式版写成硬失败，结果 secrets 为空时整条发布链路直接死掉，见 AGENTS §8）
      - name: Check release token (non-blocking)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -n "$RELEASE_TOKEN" ]; then
            echo "已配置 RELEASE_TOKEN：Release 作者将是令牌所属账号"
            exit 0
          fi
          # 用 tag 名里有没有 "-" 判断稳定/预发布，避免依赖表达式求值
          case "$GITHUB_REF_NAME" in
            *-*)
              echo "::warning::未配置 RELEASE_TOKEN：本次 Dev 版以 github-actions[bot] 发布（正文署名为 Origin-XiChen）"
              ;;
            *)
              echo "::warning::未配置 RELEASE_TOKEN：本次正式版以 github-actions[bot] 发布（正文署名为 Origin-XiChen）。需要作者显示为本人时，在仓库 Secrets 添加 RELEASE_TOKEN（PAT，需 repo 权限）"
              ;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          DESKTOP=$(node -p "require('./desktop/package.json').version")
          WEB=$(node -p "require('./web/package.json').version")
          MOBILE=$(node -p "require('./web-mobile/package.json').version")
          BACKEND=$(python -c "from novel import __version__; print(__version__)")
          TAG=${GITHUB_REF_NAME#v}
          echo "package=$PKG desktop=$DESKTOP web=$WEB mobile=$MOBILE backend=$BACKEND tag=$TAG"
          if [ "$PKG" != "$TAG" ] || [ "$DESKTOP" != "$TAG" ] || [ "$WEB" != "$TAG" ] || [ "$MOBILE" != "$TAG" ] || [ "$BACKEND" != "$TAG" ]; then
            echo "::error::版本号不一致：请同步 package.json / desktop / web / web-mobile / novel.__version__ 与 tag"
            exit 1
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Install Node dependencies
        run: npm ci

      - name: Build and publish
        run: npm run dist:publish
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Sign release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          SIGN="发布：Origin-XiChen"
          if gh release view "$TAG" >/dev/null 2>&1; then
            BODY="$(gh release view "$TAG" --json body --jq .body)"
            if [[ "$BODY" != *"$SIGN"* ]]; then
              {
                printf '%s\n' "$BODY"
                printf '\n---\n%s\n' "$SIGN"
              } > release-notes.md
              gh release edit "$TAG" --notes-file release-notes.md
            fi
          fi

  android:
    needs: windows
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Check Android signing secrets
        id: signing
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，跳过 APK 构建与上传"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.signing.outputs.enabled == 'true'

      - uses: actions/setup-node@v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        if: steps.signing.outputs.enabled == 'true'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.signing.outputs.enabled == 'true'

      - name: Install Android SDK packages
        if: steps.signing.outputs.enabled == 'true'
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install Node dependencies
        if: steps.signing.outputs.enabled == 'true'
        run: npm ci

      - name: Prepare signing key
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Android 签名 Secrets 不完整"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > web-mobile/android/release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > web-mobile/android/keystore.properties

      - name: Build release APK
        if: steps.signing.outputs.enabled == 'true'
        run: |
          npm run apk:release -w web-mobile
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release-local
          cp web-mobile/android/app/build/outputs/apk/release/app-release.apk \
            "release-local/NovelCrawler-Mobile-${VERSION}.apk"

      - name: Upload APK to GitHub Release
        if: steps.signing.outputs.enabled == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" \
            "release-local/NovelCrawler-Mobile-${VERSION}.apk" --clobber
