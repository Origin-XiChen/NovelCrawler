name: Check release token

# 发版前自检：确认 RELEASE_TOKEN 有效、且对该仓库有写权限。
# 只读操作，不会创建任何 release；需要在 Actions 页面手动触发。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify RELEASE_TOKEN
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN 未配置"
            exit 1
          fi

          LOGIN=$(gh api user --jq .login)
          echo "token 对应账号：$LOGIN"

          # 有效但权限不足时，这一步会直接 401/403，等于把问题提前暴露
          PUSH=$(gh api "repos/$REPO" --jq '.permissions.push')
          ADMIN=$(gh api "repos/$REPO" --jq '.permissions.admin')
          echo "写权限 push=$PUSH admin=$ADMIN"

          # 顺带确认能读到 releases（发布动作依赖它）
          gh api "repos/$REPO/releases?per_page=1" --jq '.[0].tag_name' >/dev/null

          if [ "$LOGIN" != "Origin-XiChen" ]; then
            echo "::warning::token 属于 $LOGIN（不是 Origin-XiChen），发布作者会显示为该账号"
          fi
          if [ "$PUSH" != "true" ] && [ "$ADMIN" != "true" ]; then
            echo "::error::token 对该仓库没有写权限：fine-grained PAT 需要 Contents: Read and write"
            exit 1
          fi
          echo "✅ RELEASE_TOKEN 可用，发布时作者会是 $LOGIN"
